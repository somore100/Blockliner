name: Build Blockliner

# Builds a Windows .exe, a macOS binary and a Linux .AppImage with build.py.
# Runs when you push a version tag (v2.4.1 etc.) or manually from the
# Actions tab. A tag push also publishes a GitHub Release with all three.
#
# Put this file at  .github/workflows/build.yml  in the GIT ROOT.
# It finds build.py by itself, so it works whether the git root is V2/
# or a folder above it.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Find app folder
        shell: bash
        run: |
          f=$(find . -maxdepth 3 -name build.py -not -path "*/node_modules/*" | head -n1)
          test -n "$f" || { echo "build.py not found"; exit 1; }
          echo "APP_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows exe
        working-directory: ${{ env.APP_DIR }}
        run: python build.py --target exe

      - uses: actions/upload-artifact@v4
        with:
          name: Blockliner-Windows
          path: ${{ env.APP_DIR }}/dist/Blockliner.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find app folder
        run: |
          f=$(find . -maxdepth 3 -name build.py | head -n1)
          test -n "$f" || { echo "build.py not found"; exit 1; }
          echo "APP_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS binary
        working-directory: ${{ env.APP_DIR }}
        run: python build.py --target binary-only

      - uses: actions/upload-artifact@v4
        with:
          name: Blockliner-macOS
          path: ${{ env.APP_DIR }}/dist/Blockliner
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find app folder
        run: |
          f=$(find . -maxdepth 3 -name build.py | head -n1)
          test -n "$f" || { echo "build.py not found"; exit 1; }
          echo "APP_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # python3-tk is needed so PyInstaller can bundle tkinter.
      # build.py handles a missing libfuse2 by itself (extract-and-run).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Linux AppImage
        working-directory: ${{ env.APP_DIR }}
        run: python build.py --target appimage

      - uses: actions/upload-artifact@v4
        with:
          name: Blockliner-Linux
          path: ${{ env.APP_DIR }}/dist/Blockliner-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Without this the release step fails with "Resource not accessible
    # by integration" (the default token is read-only).
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Blockliner-Windows
          path: dist-windows

      - uses: actions/download-artifact@v4
        with:
          name: Blockliner-macOS
          path: dist-macos

      - uses: actions/download-artifact@v4
        with:
          name: Blockliner-Linux
          path: dist-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-windows/Blockliner.exe
            dist-macos/Blockliner
            dist-linux/Blockliner-x86_64.AppImage
          generate_release_notes: true
