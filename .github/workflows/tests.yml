name: Tests

# Runs every test script (tests/run_all.py): each in its own process with an empty data folder and
# dialogs answered, so nothing reads your real settings or waits on a message box.
# Runs on every push to main, on pull requests, by hand, and before a release build (build.yml calls it).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  tests-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install a virtual screen and a window manager
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox

      - name: Install dependencies (the run-time ones; no build tools)
        run: |
          python -m pip install --upgrade pip
          pip install "Pillow>=10.0.0" "tree-sitter>=0.21.0" "tree-sitter-python>=0.21.0"

      - name: Run all tests
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" sh -c 'openbox & sleep 2; python tests/run_all.py --strict'

  # Windows: the tests that need no window. Reported, but it does not stop a release.
  tests-windows-pure:
    runs-on: windows-latest
    continue-on-error: true
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Pillow>=10.0.0" "tree-sitter>=0.21.0" "tree-sitter-python>=0.21.0"

      - name: Run the tests that need no window
        run: python tests/run_all.py --pure
